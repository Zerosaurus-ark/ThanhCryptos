<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ThanhCrypto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;

      background:
      radial-gradient(circle at top left,#312e81 0%,transparent 30%),
      radial-gradient(circle at bottom right,#7c3aed 0%,transparent 30%),
      linear-gradient(135deg,#020617,#0f172a,#111827);

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:30px;

      color:white;

      overflow-x:hidden;
    }

    .container{
      width:100%;
      max-width:430px;

      background:rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border-radius:30px;

      padding:35px 25px;

      box-shadow:
      0 0 40px rgba(139,92,246,0.25),
      0 10px 40px rgba(0,0,0,0.4);

      position:relative;
    }

    .top-glow{
      position:absolute;

      width:220px;
      height:220px;

      background:#8b5cf6;

      filter:blur(120px);

      top:-90px;
      right:-90px;

      opacity:0.35;

      z-index:-1;
    }

    .avatar{
      width:120px;
      height:120px;

      margin:auto;

      border-radius:50%;

      background-image:url('https://i.postimg.cc/Y09647gV/unnamed-1.png');

      background-size:cover;
      background-position:center;

      border:4px solid rgba(139,92,246,0.8);

      box-shadow:
      0 0 30px rgba(139,92,246,0.6),
      0 0 60px rgba(139,92,246,0.3);
    }

    h1{
      text-align:center;

      margin-top:22px;

      font-size:32px;
      font-weight:700;

      letter-spacing:1px;
    }

    .username{
      color:#a78bfa;
    }

    .bio{
      text-align:center;

      margin-top:12px;

      color:#cbd5e1;

      line-height:1.7;

      font-size:15px;
    }

    .small-text{
      text-align:center;

      color:#94a3b8;

      font-size:13px;

      margin-top:8px;
    }

    .links{
      margin-top:35px;

      display:flex;
      flex-direction:column;

      gap:16px;
    }

    .link{
      text-decoration:none;

      color:white;

      background:rgba(255,255,255,0.06);

      border:1px solid rgba(255,255,255,0.08);

      border-radius:18px;

      padding:18px 20px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      transition:0.3s ease;

      position:relative;

      overflow:hidden;
    }

    .link::before{
      content:'';

      position:absolute;

      width:100%;
      height:100%;

      background:linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.08),
      transparent);

      left:-100%;
      top:0;

      transition:0.6s;
    }

    .link:hover::before{
      left:100%;
    }

    .link:hover{
      transform:translateY(-4px) scale(1.02);

      background:rgba(139,92,246,0.15);

      border:1px solid rgba(139,92,246,0.35);

      box-shadow:
      0 0 25px rgba(139,92,246,0.35);
    }

    .left{
      display:flex;
      align-items:center;

      gap:14px;
    }

    .icon{
      width:28px;
      height:28px;

      object-fit:contain;

      border-radius:8px;
    }

    .title{
      font-size:16px;
      font-weight:500;
    }

    .arrow{
      color:#a78bfa;

      font-size:18px;
    }

    .socials{
      margin-top:35px;

      display:flex;
      justify-content:center;

      gap:18px;
    }

    .social{
      width:50px;
      height:50px;

      border-radius:16px;

      background:rgba(255,255,255,0.06);

      display:flex;
      justify-content:center;
      align-items:center;

      text-decoration:none;

      color:white;

      font-size:20px;

      transition:0.3s;
    }

    .social:hover{
      transform:translateY(-5px);

      background:#8b5cf6;

      box-shadow:
      0 0 20px rgba(139,92,246,0.45);
    }

    footer{
      text-align:center;

      margin-top:35px;

      color:#64748b;

      font-size:13px;
    }

    @media(max-width:480px){

      .container{
        padding:30px 20px;
      }

      h1{
        font-size:28px;
      }

      .title{
        font-size:15px;
      }

    }

  </style>
</head>
